services:
  rewind:
    build: .
    container_name: rewind
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${WEB_PORT:-8088}:8000"
    environment:
      MUSIC_DIR: /music
      APP_PASSWORD: "${APP_PASSWORD:?Set APP_PASSWORD in .env}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - ./music:/music
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
